plugins {
    id 'com.android.application'
}

android {
    namespace 'lk.vezel.console'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'lk.vezel.console'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    sourceSets {
        main.assets.srcDirs += [rootProject.file('shared')]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
