plugins {
    id 'com.android.application'
}

android {
    namespace 'lk.vezel.console'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'lk.vezel.console'
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName '1.6.1'
    }

    sourceSets {
        main.assets.srcDir rootProject.file('shared')
        if (providers.gradleProperty('personalVehicle').orNull == 'true') {
            main.assets.srcDir rootProject.file('private-assets/photo')
        }
    }

    androidResources {
        // The audio cues are played directly from their APK file descriptors.
        noCompress += ['mp3', 'wav']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
